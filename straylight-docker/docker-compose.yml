services:
  whatsupdocker:
    image: getwud/wud:8.2.2
    container_name: wud
    restart: unless-stopped
    volumes:
      - ./wud:/store
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/wud/docker-compose.yml
    ports:
      - 3333:3000
    environment:
      - WUD_TRIGGER_DOCKERCOMPOSE_STRAYLIGHT_FILE=/wud/docker-compose.yml
      - WUD_TRIGGER_DOCKERCOMPOSE_STRAYLIGHT_PRUNE=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STRAYLIGHT_BACKUP=true
      - WUD_TRIGGER_DOCKERCOMPOSE_STRAYLIGHT_THRESHOLD=patch
      - WUD_TRIGGER_SMTP_ICLOUD_HOST=smtp.mail.me.com
      - WUD_TRIGGER_SMTP_ICLOUD_PORT=587
      - WUD_TRIGGER_SMTP_ICLOUD_USER=gabriel@saillard.dev
      - WUD_TRIGGER_SMTP_ICLOUD_PASS=${ICLOUD_SMTP_PASS}
      - WUD_TRIGGER_SMTP_ICLOUD_FROM=gabriel@saillard.dev
      - WUD_TRIGGER_SMTP_ICLOUD_TO=gabriel@saillard.dev
      - WUD_TRIGGER_SMTP_ICLOUD_TLS_ENABLED=false
      - WUD_TRIGGER_SMTP_ICLOUD_MODE=batch
    labels:
      - "wud.watch=false"
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    network_mode: host
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      # General settings
      SAMBA_GLOBAL_STRAW: "vfs objects = fruit streams_xattr"
      SAMBA_GLOBAL_STRAW2: "fruit:metadata = stream"
      SAMBA_GLOBAL_STRAW3: "fruit:model = MacSamba"
      SAMBA_GLOBAL_STRAW4: "fruit:nfs_aces = no"

      ACCOUNT_gaby: "${SAMBA_PASSWORD}"
      UID_gaby: "1000"

      ACCOUNT_guest: "${SAMBA_GUEST_PASSWORD}"
      UID_guest: "1000"

      # General storage share
      SAMBA_VOLUME_CONFIG_storage: |
        [storage]
          path = /storage
          valid users = gaby,guest
          read only = no
          browseable = yes

      # Time Machine share with 500GB quota
      SAMBA_VOLUME_CONFIG_timemachine: |
        [timemachine]
          path = /timemachine
          valid users = gaby
          read only = no
          browseable = yes
          fruit:time machine = yes
          fruit:time machine max size = 1000G
    volumes:
      - /mnt/mergerfs:/storage
      - /mnt/mergerfs/TimeMachine:/timemachine
    tmpfs:
      - /tmp
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    group_add:
      - "993"
    network_mode: host
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: /mnt/mergerfs
        target: /media
        read_only: true
    devices:
      - /dev/dri:/dev/dri
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - jellyfin
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      caddy_proxy:
        ipv4_address: 172.30.10.2
    environment:
      - TZ=Europe/Paris
    labels:
      - "wud.tag.include=^\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  fail2ban:
    image: lscr.io/linuxserver/fail2ban:1.1.0
    container_name: fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
    volumes:
      - ./caddy/fail2ban:/config
      - ./jellyfin/config/log:/remotelogs/jellyfin:ro
    labels:
      - "wud.watch=false"
  prowlarr:
    image: ghcr.io/hotio/prowlarr:release-2.4.0.5397
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./prowlarr:/config
    ports:
      - 9696:9696
    labels:
      - "wud.tag.include=^release-\\d+\\.\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  radarr:
    image: ghcr.io/hotio/radarr:release-6.2.1.10461
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./radarr:/config
      - /mnt/mergerfs:/data
    ports:
      - 7878:7878
    labels:
      - "wud.tag.include=^release-\\d+\\.\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  sonarr:
    image: ghcr.io/hotio/sonarr:release-4.0.19.2979
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./sonarr:/config
      - /mnt/mergerfs:/data
    ports:
      - 8989:8989
    labels:
      - "wud.tag.include=^release-\\d+\\.\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-5.2.3
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./qbittorrent:/config
      - ../qbittorrent-download-cache:/downloads-cache
      - /mnt/mergerfs/Downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    labels:
      - "wud.tag.include=^release-\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.6.4
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/Paris
    labels:
      - "wud.tag.include=^\\d{4}\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  adguard:
    container_name: adguard
    image: adguard/adguardhome:v0.107.78
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    environment:
      - TZ=Europe/Paris
    labels:
      - "wud.tag.include=^v\\d+\\.\\d+\\.\\d+$$"
      - "wud.compose.file=/wud/docker-compose.yml"
  linear-agent-controller:
    container_name: linear-agent-controller
    image: linear-agent-controller:local
    build:
      context: ./linear-agent
      target: controller
    restart: unless-stopped
    init: true
    depends_on:
      linear-agent-runner:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      LINEAR_CLIENT_ID: "${LINEAR_CLIENT_ID}"
      LINEAR_CLIENT_SECRET: "${LINEAR_CLIENT_SECRET}"
      LINEAR_WEBHOOK_SECRET: "${LINEAR_WEBHOOK_SECRET}"
      LINEAR_AGENT_INSTALL_SECRET: "${LINEAR_AGENT_INSTALL_SECRET}"
      LINEAR_AGENT_PUBLIC_URL: "${LINEAR_AGENT_PUBLIC_URL}"
      LINEAR_REDIRECT_URI: "${LINEAR_AGENT_PUBLIC_URL}/linear/oauth/callback"
      LINEAR_AGENT_STATE_DIR: /app/state
      PI_RUNNER_URL: http://linear-agent-runner:8788
      PI_RUNNER_TOKEN: "${LINEAR_AGENT_RUNNER_SECRET}"
    volumes:
      - ./linear-agent/data:/app/state
    networks:
      - linear_agent_control
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    labels:
      - "dev.straylight.linear-agent.component=controller"
      - "wud.watch=false"
  linear-agent-runner:
    container_name: linear-agent-runner
    image: linear-agent-runner:local
    build:
      context: ./linear-agent
      target: workbench
    restart: unless-stopped
    init: true
    depends_on:
      linear-agent-claude-capsule:
        condition: service_healthy
    group_add:
      - "${DOCKER_GID}"
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      PI_RUNNER_TOKEN: "${LINEAR_AGENT_RUNNER_SECRET}"
      STRAYLIGHT_RUNNER: "${LINEAR_AGENT_RUNNER_BACKEND:-claude}"
      PI_DOCKER_SOCKET: /var/run/docker.sock
      PI_TASK_IMAGE: linear-agent-runner:local
      PI_TASK_NETWORK: linear-agent-tasks
      PI_HOST_ROOT: "${LINEAR_AGENT_HOST_ROOT:-/home/gaby/straylight-docker/linear-agent}"
      PI_WORKBENCH_DATA_DIR: /workbench/data
      PI_WORKSPACE_RUNS_DIR: /workbench/workspace-runs
      PI_REPOSITORY_DIR: /repositories
      PI_REPOSITORY_REFRESH_TTL_MS: "${LINEAR_AGENT_REPOSITORY_REFRESH_TTL_MS:-300000}"
      PI_WORKSPACE_INSTRUCTIONS: /workbench/AGENTS.md
      PI_CONFIG_SOURCE: /workbench/pi-config
      PI_TOOL_PROFILE_DIR: /tool-profile
      GH_CONFIG_DIR: /tool-profile/gh
      GIT_CONFIG_GLOBAL: /tool-profile/gitconfig
      GIT_TERMINAL_PROMPT: "0"
      PI_MAX_WARM_SESSIONS: "${LINEAR_AGENT_MAX_WARM_SESSIONS:-3}"
      PI_WARM_SESSION_TTL_MS: "${LINEAR_AGENT_WARM_SESSION_TTL_MS:-600000}"
      PI_TASK_STARTUP_TIMEOUT_MS: "30000"
      PI_TASK_MEMORY_BYTES: "4294967296"
      PI_TASK_NANO_CPUS: "2000000000"
      PI_TASK_PIDS_LIMIT: "512"
      PI_POSTGRES_IMAGE: "postgres:17.10-bookworm"
      PI_BROWSER_IMAGE: "linear-agent-browser:local"
      PI_BROWSER_VERSION: "1.62.0"
      PI_MEMORY_DIR: /memory
      PI_SERVICE_MEMORY_BYTES: "2147483648"
      PI_SERVICE_NANO_CPUS: "1000000000"
      PI_SERVICE_PIDS_LIMIT: "256"
      CAPSULE_URL: http://linear-agent-claude-capsule:8790
      LINEAR_CONTROLLER_URL: http://linear-agent-controller:8787
      CAPSULE_AUTH_URL: "${LINEAR_AGENT_PUBLIC_URL}/linear/capsule/auth"
      TOOL_AUTH_URL: "${LINEAR_AGENT_PUBLIC_URL}/linear/tools/auth"
      CAPSULE_CONTROL_TOKEN_FILE: /run/secrets/capsule-control-token # yadm-secret-scan: ignore
    volumes:
      - ./linear-agent/data/capsule-control-token:/run/secrets/capsule-control-token:ro # yadm-secret-scan: ignore
      - /var/run/docker.sock:/var/run/docker.sock
      - ./linear-agent/data:/workbench/data
      - ./linear-agent/pi-config:/workbench/pi-config
      - ./linear-agent/pi-config:/home/node/.pi/agent
      - ./linear-agent/tool-profile:/tool-profile
      - ./linear-agent/memory:/memory
      - ./linear-agent/workspace/repos:/repositories
      - ./linear-agent/workspace/runs:/workbench/workspace-runs
      - ./linear-agent/workspace/AGENTS.md:/workbench/AGENTS.md:ro
    networks:
      - linear_agent_control
      - linear_agent_tasks
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    labels:
      - "dev.straylight.linear-agent.component=runner"
      - "wud.watch=false"

  linear-agent-claude-capsule:
    container_name: linear-agent-claude-capsule
    image: linear-agent-claude-capsule:local
    build:
      context: ./linear-agent/claude-capsule
      args:
        CLAUDE_CODE_VERSION: "2.1.226"
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      CAPSULE_CONTROL_TOKEN_FILE: /run/secrets/capsule-control-token # yadm-secret-scan: ignore
    volumes:
      - linear_agent_claude_profile:/home/node
      - ./linear-agent/data/capsule-control-token:/run/secrets/capsule-control-token:ro # yadm-secret-scan: ignore
    networks:
      - linear_agent_tasks
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8790/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    labels:
      - "dev.straylight.linear-agent.component=claude-capsule"
      - "wud.watch=false"

networks:
  caddy_proxy:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  linear_agent_control:
    name: linear-agent-control
    driver: bridge
  linear_agent_tasks:
    name: linear-agent-tasks
    driver: bridge

volumes:
  linear_agent_claude_profile:
    name: "${LINEAR_AGENT_CLAUDE_PROFILE_VOLUME:-linear-agent-claude-profile}"
